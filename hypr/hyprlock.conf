# Two-column lock screen. Positions are relative to the centre of each monitor.
$font = ProFontWindows Nerd Font Mono
$cream = rgb(eee8dd)
$muted = rgb(bcb5ab)
$red = rgb(bc3b3b)
$dark = rgb(1c1717)

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/Git/Custom-environment/wallpapers/night_city.jpg
    color = rgb(223638)
    blur_passes = 4
    blur_size = 10
    brightness = 0.7
    noise = 0.02
}

# Login card.
shape {
    monitor =
    size = 360, 380
    color = rgba(28, 40, 39, 0.6)
    rounding = 25
    position = -200, 160
    halign = center
    valign = center
    zindex = 0
}

label {
    monitor =
    text = NixOS
    color = $muted
    font_size = 20
    font_family = $font
    position = -200, 300
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = Log in
    color = $cream
    font_size = 56
    font_family = $font
    position = -200, 235
    halign = center
    valign = center
    zindex = 2
}

shape {
    monitor =
    size = 320, 70
    color = $red
    rounding = 20
    position = -200, 130
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = Username
    color = $dark
    font_size = 14
    font_family = $font
    position = -295, 150
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = $USER
    color = $dark
    font_size = 28
    font_family = $font
    position = -200, 117
    halign = center
    valign = center
    zindex = 2
}

input-field {
    monitor =
    size = 320, 70
    outline_thickness = 0
    inner_color = $red
    font_color = $dark
    font_family = $font
    placeholder_text = Password
    fail_text = <i>$FAIL</i>
    fail_color = rgb(e15b64)
    check_color = rgb(cda67d)
    capslock_color = rgb(cda67d)
    rounding = 20
    fade_on_empty = false
    position = -200, 40
    halign = center
    valign = center
    zindex = 2
}

# Clock card.
shape {
    monitor =
    size = 360, 160
    color = rgba(28, 40, 39, 0.6)
    rounding = 25
    position = -200, -140
    halign = center
    valign = center
    zindex = 0
}

label {
    monitor =
    text = $TIME
    color = $cream
    font_size = 96
    font_family = $font
    position = -200, -120
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:60000] sh ~/.config/hypr/scripts/lock-status.sh uptime
    color = $muted
    font_size = 18
    font_family = $font
    position = -200, -195
    halign = center
    valign = center
    zindex = 2
}

# Profile and date card.
shape {
    monitor =
    size = 360, 650
    color = rgba(28, 40, 39, 0.6)
    rounding = 25
    position = 200, 25
    halign = center
    valign = center
    zindex = 0
}

image {
    monitor =
    path = ~/Git/Custom-environment/wallpapers/kotost.png
    size = 124
    rounding = 24
    border_size = 4
    border_color = $red
    position = 200, 260
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:60000] sh ~/.config/hypr/scripts/lock-status.sh weekday
    color = $cream
    font_size = 56
    font_family = $font
    position = 200, 150
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:60000] sh ~/.config/hypr/scripts/lock-status.sh date
    color = $muted
    font_size = 20
    font_family = $font
    position = 200, 100
    halign = center
    valign = center
    zindex = 2
}

# Media and device card.
